<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-3lSuu7BhWmWHBsCg/ASPbvs2z48JfANPqTuP2HNud9s='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://rabbtdooayruveribarq.supabase.co; connect-src 'self' https://rabbtdooayruveribarq.supabase.co wss://rabbtdooayruveribarq.supabase.co; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<!-- app-head -->
<meta name="theme-color" content="#0b0d12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trading">
<script>try{var t=localStorage.getItem('td_theme');if(t){document.documentElement.dataset.theme=t;}var l=t?t==='light':matchMedia('(prefers-color-scheme: light)').matches;document.querySelector('meta[name=theme-color]').content=l?'#f5f6fa':'#0b0d12';}catch(e){}</script>
<!-- /app-head -->
<title>Business — Trading Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="dashboard.css" />
<link rel="stylesheet" href="business.css" />
</head>
<body>

<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">◈</span>
      <span class="brand-text">Trading Journal</span>
    </div>
    <nav class="tabnav"></nav>
    <div class="account-switcher" id="accountSwitcher"></div>
    <label class="bz-year">Jahr <select id="yearSelect"></select></label>
  </header>

  <main class="dash-main business">

    <!-- Jahresbilanz -->
    <section class="bz-kpis" aria-label="Jahresbilanz">
      <div class="bz-kpi"><span class="kpi-label">Einnahmen</span><span class="kpi-value pos" id="kIncome">–</span><span class="bz-sub">Auszahlungen beim Zufluss</span></div>
      <div class="bz-kpi"><span class="kpi-label">Ausgaben</span><span class="kpi-value neg" id="kExpenses">–</span><span class="bz-sub" id="kExpSub"></span></div>
      <div class="bz-kpi"><span class="kpi-label">Ergebnis</span><span class="kpi-value" id="kResult">–</span><span class="bz-sub" id="kTotal"></span></div>
      <a class="bz-kpi bz-link" href="#todo"><span class="kpi-label">Offene Aufgaben</span><span class="kpi-value" id="kTodo">–</span><span class="bz-sub">Belege, Status, Lücken</span></a>
    </section>

    <section class="panel" id="todo">
      <div class="panel-header"><h3>Zu erledigen</h3><span class="bz-hint" id="todoYear"></span></div>
      <div id="todoList"><span class="skel line"></span><span class="skel line"></span></div>
    </section>

    <section class="panel">
      <div class="panel-header"><h3>Monate</h3><span class="bz-hint">grün Einnahmen · rot Ausgaben · Linie kumuliertes Ergebnis</span></div>
      <div class="bz-chart" id="monthChart"></div>
      <details class="bz-details"><summary>Tabelle anzeigen</summary>
        <div class="bz-scroll"><table class="bz-table" id="monthTable"></table></div>
      </details>
    </section>

    <section class="panel" id="konten" data-tier="prop">
      <div class="panel-header">
        <h3>Challenges & Konten</h3>
        <span class="bz-hint">Gebühr gegen Auszahlung – hat sich das Konto gelohnt?</span>
      </div>
      <div class="bz-stats" id="challengeStats"></div>
      <div class="bz-scroll"><table class="bz-table" id="accountTable"></table></div>
      <form id="feeForm" class="bz-fee" hidden>
        <b id="feeTitle"></b>
        <label>Datum<input type="date" name="date" required></label>
        <label>Betrag (€)<input type="number" name="amount" step="0.01" min="0" required></label>
        <label class="wide">Beschreibung<input type="text" name="description" required></label>
        <button class="btn-primary sm" type="submit">Gebühr speichern</button>
        <button class="btn-ghost sm" type="button" id="feeCancel">Abbrechen</button>
      </form>
    </section>
  </main>
</div>

<script type="module" src="business.js"></script>
</body>
</html>
